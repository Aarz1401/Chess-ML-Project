name: Publish Game Atlas

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "tests/check_*_ui.cjs"
      - "scripts/check_website.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "tests/check_*_ui.cjs"
      - "scripts/check_website.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install UI test dependencies
        run: npm ci --prefix website --ignore-scripts
      - name: Check JavaScript
        run: npm run check --prefix website
      - name: Check both interfaces under the project URL
        run: npm test --prefix website
      - name: Check static links and deployment assets
        run: python3 scripts/check_website.py
      - name: Upload website only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
